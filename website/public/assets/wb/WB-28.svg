<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="The server journey, two roads from one portal: the client's portal at the left; the cloud road above - our team confirms on payment, the URL and the admin access within 24 hours, nothing to install; the plant road below - our team replies with the install link, the client prepares one box, one command installs, the licence is activated; both roads meet at the right: link the SOP Edge Devices, draw the line in the editor, the pages run">
<!-- pilot - 2026-09-19 - drawn by scripts/draw-journey-strip.py (D75, D117); the dress of SC-D2; v2 taller and wider -->
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#46C3EE"/></marker></defs>
<style>.rt{font-family:Saira,Inter,Arial,sans-serif;font-size:24px;font-weight:600;letter-spacing:.8px;fill:#FFFFFF}.rl{font-family:Saira,Inter,Arial,sans-serif;font-size:18px;font-weight:400;letter-spacing:.3px;fill:#9DB0C4}.rc{font-family:"JetBrains Mono",Consolas,monospace;font-size:16px;letter-spacing:1px;fill:#EE9F46}.ln{font-family:Saira,Inter,Arial,sans-serif;font-size:16px;font-weight:600;letter-spacing:1.6px;fill:#1E7FA6}.say{font-family:Saira,Inter,Arial,sans-serif;font-size:21px;font-weight:600;fill:#1E7FA6}</style>
<rect x="20" y="191" width="190" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="115.0" y="235" text-anchor="middle">Your portal</text>
<text class="rl" x="115.0" y="273" text-anchor="middle">request the licence:</text>
<text class="rl" x="115.0" y="299" text-anchor="middle">cloud, or your plant</text>
<rect x="1390" y="191" width="190" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="1485.0" y="235" text-anchor="middle">Live</text>
<text class="rl" x="1485.0" y="273" text-anchor="middle">link your</text>
<text class="rl" x="1485.0" y="299" text-anchor="middle">SOP Edge Devices,</text>
<text class="rl" x="1485.0" y="325" text-anchor="middle">draw the line</text>
<text class="ln" x="260" y="36">IN THE CLOUD · A VPS OF YOUR OWN, NOT SHARED</text>
<text class="ln" x="260" y="314">IN YOUR PLANT · A BOX OF YOUR OWN, AIR-GAPPED IF YOUR RULES SAY SO</text>
<rect x="260" y="52" width="333" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="426.5" y="96" text-anchor="middle">Our team confirms</text>
<text class="rl" x="426.5" y="134" text-anchor="middle">on payment</text>
<rect x="623" y="52" width="333" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="789.5" y="96" text-anchor="middle">Your access arrives</text>
<text class="rl" x="789.5" y="134" text-anchor="middle">the URL and the admin account,</text>
<text class="rl" x="789.5" y="160" text-anchor="middle">sent by our team</text>
<rect x="698.5" y="202" width="182.0" height="30" rx="6" fill="rgba(238,159,70,.14)" stroke="#EE9F46" stroke-width="1.6"/>
<text class="rc" x="789.5" y="223" text-anchor="middle">WITHIN 24 HOURS</text>
<rect x="986" y="52" width="333" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="1152.5" y="96" text-anchor="middle">Nothing to install</text>
<text class="rl" x="1152.5" y="134" text-anchor="middle">a complete VPS, yours alone;</text>
<text class="rl" x="1152.5" y="160" text-anchor="middle">your collectors link from the plant</text>
<rect x="260" y="330" width="242" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="381.0" y="374" text-anchor="middle">Our team replies</text>
<text class="rl" x="381.0" y="412" text-anchor="middle">the install link</text>
<text class="rl" x="381.0" y="438" text-anchor="middle">and the instructions</text>
<rect x="532" y="330" width="242" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="653.0" y="374" text-anchor="middle">Prepare one box</text>
<text class="rl" x="653.0" y="412" text-anchor="middle">a Windows machine,</text>
<text class="rl" x="653.0" y="438" text-anchor="middle">a fixed address</text>
<rect x="805" y="330" width="242" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="926.0" y="374" text-anchor="middle">One command</text>
<text class="rl" x="926.0" y="412" text-anchor="middle">installs everything,</text>
<text class="rl" x="926.0" y="438" text-anchor="middle">unattended, then</text>
<text class="rl" x="926.0" y="464" text-anchor="middle">you walk away</text>
<rect x="855.8" y="480" width="140.4" height="30" rx="6" fill="rgba(238,159,70,.14)" stroke="#EE9F46" stroke-width="1.6"/>
<text class="rc" x="926.0" y="501" text-anchor="middle">ONE COMMAND</text>
<rect x="1077" y="330" width="242" height="200" rx="10" fill="#14202F"/>
<text class="rt" x="1198.0" y="374" text-anchor="middle">Activate</text>
<text class="rl" x="1198.0" y="412" text-anchor="middle">the licence, against</text>
<text class="rl" x="1198.0" y="438" text-anchor="middle">your installation, once</text>
<path d="M210,291 L235,291 L235,152 L253,152" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M210,291 L235,291 L235,430 L253,430" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M598,152 L616,152" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M961,152 L979,152" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M507,430 L525,430" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M780,430 L798,430" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M1052,430 L1070,430" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M1325,152 L1355,152 L1355,291 L1383,291" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M1325,430 L1355,430 L1355,291 L1383,291" fill="none" stroke="#46C3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<line x1="20" y1="560" x2="1580" y2="560" stroke="#EE9F46" stroke-width="3"/>
<text class="say" x="800" y="588" text-anchor="middle">Either way, the next step is the same: link your SOP Edge Devices, draw the first line in the editor, and its pages run.</text>
</svg>
